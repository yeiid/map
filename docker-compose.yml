services:
  # ─── Spatial Database ────────────────────────────────────────────────────────
  db:
    image: postgis/postgis:15-3.4
    container_name: map-db
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mapengine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mapengine123}
      POSTGRES_DB: ${POSTGRES_DB:-mapdb}
    command: >
      postgres
        -c shared_buffers=${PG_SHARED_BUFFERS:-512MB}
        -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
        -c work_mem=${PG_WORK_MEM:-32MB}
        -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
        -c random_page_cost=1.1
        -c max_wal_size=2GB
        -c min_wal_size=512MB
        -c checkpoint_completion_target=0.9
        -c log_min_duration_statement=2000
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - map-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mapengine} -d ${POSTGRES_DB:-mapdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Vector Tile Server (Martin) ──────────────────────────────────────────
  tiles:
    image: maplibre/martin:latest
    container_name: map-tiles
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mapengine}:${POSTGRES_PASSWORD:-mapengine123}@db:5432/${POSTGRES_DB:-mapdb}
      - MARTIN_LISTEN_ADDRESS=0.0.0.0:3000
      - MARTIN_CORS_ORIGIN=*
    # Puertos internos; se accede vía gateway:80/tiles
    networks:
      - map-net

  # ─── Map Manager & Style API ───────────────────────────────────────────────
  manager:
    build:
      context: .
    container_name: map-manager
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mapengine}:${POSTGRES_PASSWORD:-mapengine123}@db:5432/${POSTGRES_DB:-mapdb}
      MARTIN_URL: http://tiles:3000
      PUBLIC_MARTIN_URL: ${PUBLIC_MARTIN_URL}
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - ./styles:/app/styles
      - ./fonts:/app/fonts
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      tiles:
        condition: service_started
    # Puertos internos; se accede vía gateway:80
    networks:
      - map-net

  # ─── Reverse Proxy (The Efficiency Layer) ─────────────────────────────────
  gateway:
    image: nginx:alpine
    container_name: map-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - manager
      - tiles
    networks:
      - map-net

volumes:
  db_data:

networks:
  map-net:
    driver: bridge
