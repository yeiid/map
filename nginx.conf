server {
    listen 80;
    server_name localhost; # En producción cambia esto a tu dominio

    # Detectar el protocolo HTTPS correcto detrás de Traefik / Proxy inverso
    set $x_proto $http_x_forwarded_proto;
    if ($x_proto = "") {
        set $x_proto $scheme;
    }

    # Optimizaciones de Red
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Resolver para Docker (Necesario cuando se usan variables en proxy_pass)
    resolver 127.0.0.11 valid=30s;

    # Compresión Gzip (Crítico para Vector Tiles)
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types 
        text/plain 
        text/css 
        application/json 
        application/javascript 
        text/xml 
        application/xml 
        application/xml+rss 
        text/javascript 
        application/x-protobuf
        application/octet-stream;

    # ─── Frontend & Manager API ───────────────────────
    location / {
        proxy_pass http://manager:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # ─── Tiles Server (Martin) ────────────────────────
    location /tiles/ {
        proxy_pass http://tiles:3000/;
        
        # Caché agresivo para Tiles (7 días)
        expires 7d;
        add_header Cache-Control "public, no-transform";
        
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

}
